<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Campus Tour Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Admin button on top of panorama */
    #adminBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      padding: 8px 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    #adminBtn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->

<div id="navbar">

  <div class="college-name">
    St.Peters College Of Engineering And Technology
  </div>

  <div id="menuContainer"></div>

</div>



<div id="panorama" style="width:100vw;height:100vh;"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
<script src="{{ url_for('static', filename='viewer.js') }}"></script>

</body>
</html>
