<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Scene Builder</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

#panorama{
width:100vw;
height:100vh;
}

#adminBtn{
position:absolute;
top:20px;
left:20px;
z-index:1000;
padding:8px 12px;
background:#007BFF;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

/* Direction buttons */

.dir{
position:absolute;
font-size:40px;
font-weight:bold;
color:white;
cursor:pointer;
z-index:1000;
user-select:none;
}

/* fixed positions */

.forward{ top:12%; left:50%; transform:translateX(-50%); }
.back{ bottom:12%; left:50%; transform:translateX(-50%); }
.left{ left:6%; top:50%; transform:translateY(-50%); }
.right{ right:6%; top:50%; transform:translateY(-50%); }

.plus{
color:#00ff99;
}

.arrow{
color:white;
}

.uploadBox{
position:absolute;
background:#222;
padding:12px;
border-radius:6px;
z-index:2000;
}

.info-hotspot{
cursor:pointer;
}


/* =========================
Arrow Container (IMPORTANT)
========================= */
.street-arrow-hotspot{
  width:70px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  background: transparent !important;
}

/* =========================
Main Arrow
========================= */
.street-arrow {

  width: 0;
  height: 0;

  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-bottom: 34px solid rgba(255,255,255,0.95);

  position: relative;

  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
  transition: all 0.25s ease;

}

/* =========================
Arrow Tail
========================= */
.street-arrow::after {

  content: "";

  position: absolute;

  top: 30px;
  left: -6px;

  width: 12px;
  height: 14px;

  background: rgba(255,255,255,0.95);

  border-radius: 2px;

}

/* =========================
Hover Effect
========================= */
.street-arrow-hotspot:hover .street-arrow {

  transform: scale(1.15);

  border-bottom-color: #ffffff;

  filter: drop-shadow(0 8px 14px rgba(0,0,0,0.6));
}

/* =========================
REMOVE unwanted backgrounds
========================= */

/* Remove pannellum default hotspot styling */
/* keep hotspot working, only remove visuals */
.pnlm-hotspot-base{
  background: transparent !important;
  box-shadow: none !important;
}

.pnlm-hotspot{
  background: transparent !important;
}

/* remove default icon ONLY */
.pnlm-hotspot-base::before,
.pnlm-hotspot-base::after{
  display:none !important;
}


</style>

</head>

<body>

<a href="/">
<button id="adminBtn">Back to Admin</button>
</a>

<div id="panorama"></div>


<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<script>

let viewer;
let isDragging = false;
let startX = 0;
let startY = 0;

fetch("/static/scenes.json")
.then(res=>res.json())
.then(SCENES=>{

const params=new URLSearchParams(window.location.search);
let current=params.get("scene") || Object.keys(SCENES)[0];

/* =========================
DIRECTION MAP
========================= */

const DIRECTION_YAW = {
  forward: 0,
  right: 90,
  back: 180,
  left: -90
};

/* =========================
ARROW UI (same as viewer)
========================= */

function createArrow(div, args){

  /* KEEP pannellum base class (VERY IMPORTANT) */
  div.classList.add("street-arrow-hotspot");

  /* remove only inner default content */
  div.innerHTML = "";

  const arrow = document.createElement("div");
  arrow.className = "street-arrow";

  div.appendChild(arrow);

}

/* =========================
HOTSPOTS BUILD
========================= */

const hotSpots = [];

/* ---- Navigation arrows ---- */

Object.keys(DIRECTION_YAW)
.filter(dir => SCENES[current][dir])
.forEach(dir=>{

  hotSpots.push({

    pitch:-3,
    yaw:DIRECTION_YAW[dir],

    createTooltipFunc:createArrow,
    createTooltipArgs:{direction:dir},

    clickHandlerFunc:function(){
      window.location=`/builder?scene=${SCENES[current][dir]}`;
    }

  });

});

/* ---- Existing info hotspots ---- */

(SCENES[current].hotspots || []).forEach((h,index)=>{

  hotSpots.push({

    pitch:h.pitch,
    yaw:h.yaw,

    createTooltipFunc:createHotspot,

    createTooltipArgs:{
      text:h.text,
      index:index
    }

  });

});

/* =========================
INIT VIEWER
========================= */

viewer = pannellum.viewer("panorama",{

  type:"equirectangular",
  panorama:`/static/images/${SCENES[current].image}`,
  autoLoad:true,
  hotSpots:hotSpots

});


/* ===============================
DRAG DETECTION
================================ */

viewer.on("mousedown",function(e){

  isDragging=false;

  startX=e.clientX;
  startY=e.clientY;

});

viewer.on("mousemove",function(e){

  const dx=Math.abs(e.clientX-startX);
  const dy=Math.abs(e.clientY-startY);

  if(dx>6 || dy>6){
    isDragging=true;
  }

});


/* ===============================
CREATE HOTSPOT (CLICK ONLY)
================================ */

viewer.on("mouseup",function(event){

  if(isDragging) return;

  const coords=viewer.mouseEventToCoords(event);

  if(!coords) return;

  const pitch=coords[0];
  const yaw=coords[1];

  const name=prompt("Enter hotspot name");

  if(!name) return;

  fetch("/add-hotspot",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      scene:current,
      pitch:pitch,
      yaw:yaw,
      text:name

    })

  })

  .then(res=>res.json())
  .then(()=>{

    viewer.addHotSpot({

      pitch:pitch,
      yaw:yaw,

      createTooltipFunc:createHotspot,

      createTooltipArgs:{
        text:name
      }

    });

  });

});


/* ===============================
HOTSPOT UI
================================ */

function createHotspot(div,args){

  div.classList.add("info-hotspot");

  /* ICON */
  const icon=document.createElement("div");
  icon.innerText="i";

  icon.style.width="30px";
  icon.style.height="30px";
  icon.style.borderRadius="50%";
  icon.style.background="rgba(255,255,255,0.9)";
  icon.style.color="#000";
  icon.style.display="flex";
  icon.style.alignItems="center";
  icon.style.justifyContent="center";
  icon.style.fontWeight="bold";

  /* LABEL */
  const label=document.createElement("div");

  label.innerText=args.text;

  label.style.position="absolute";
  label.style.bottom="45px";
  label.style.left="50%";
  label.style.transform="translateX(-50%)";

  label.style.background="rgba(0,0,0,0.75)";
  label.style.color="white";
  label.style.padding="6px 10px";
  label.style.borderRadius="6px";
  label.style.fontSize="13px";

  div.appendChild(icon);
  div.appendChild(label);

  /* EDIT */
  div.onclick=function(e){

    e.stopPropagation();

    const newName=prompt("Edit hotspot name",args.text);

    if(!newName) return;

    fetch("/update-hotspot",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        scene:current,
        oldText:args.text,
        newText:newName

      })

    })

    .then(()=>{
      label.innerText=newName;
    });

  };

  /* DELETE */
  div.oncontextmenu=function(e){

    e.preventDefault();

    if(!confirm("Delete this hotspot?")) return;

    fetch("/delete-hotspot",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        scene:current,
        text:args.text

      })

    })

    .then(()=>{
      div.remove();
    });

  };

}

});
</script>
</body>
</html>
