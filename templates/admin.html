<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campus Tour Admin</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<!-- VIS NETWORK -->
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-edgehandles/cytoscape-edgehandles.js"></script>

<style>
tr.dragging { opacity:0.4 }
tr { cursor:grab }
</style>

<script>

function populateDropdowns(){

const sceneIds = {{ scenes.keys() | list | tojson }};
const scenesData = {{ scenes | tojson }};

const uploadTarget=document.getElementById("uploadTarget")

if(uploadTarget){

uploadTarget.innerHTML='<option value="">None</option>'

sceneIds.forEach(id=>{
let opt=document.createElement("option")
opt.value=id
opt.text=id
uploadTarget.add(opt)
})

}

document.querySelectorAll(".edit-dropdown").forEach(select=>{

const current=select.dataset.current || ""
const dir=select.name
const row=select.closest("tr")
const currentScene=row.dataset.id

const dirLabel={
forward:"Forward",
back:"Backward",
left:"Left",
right:"Right"
}[dir] || "Direction"

const usedTargets=Object.values(scenesData[currentScene]||{}).filter(v=>sceneIds.includes(v))

select.innerHTML=""

let noneOpt=document.createElement("option")
noneOpt.value=""
noneOpt.text=`${dirLabel} → No Scene`
if(!current) noneOpt.selected=true
select.add(noneOpt)

sceneIds.forEach(id=>{

if(usedTargets.includes(id) && id!==current) return

let opt=document.createElement("option")
opt.value=id
opt.text=id

if(id===current) opt.selected=true

select.add(opt)

})

})

}

window.onload=populateDropdowns

</script>

</head>

<body>

<div class="container">

<header>
<h1>Campus Tour Admin</h1>

<a href="/viewer">
<button class="primary-btn">Open Viewer</button>
</a>

<a href="/builder">
<button class="primary-btn">Open Scene Builder</button>
</a>

</header>


<!-- UPLOAD -->
<div class="card">

<h2>Upload New Scene</h2>

<form action="/upload" method="POST" enctype="multipart/form-data" class="form-grid">

<input type="file" name="image" required>

<select name="direction">
<option value="">No direction (first scene)</option>
<option value="forward">Forward</option>
<option value="back">Back</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>

<select name="target" id="uploadTarget"></select>

<button class="primary-btn">Upload</button>

</form>

</div>


<!-- EXISTING SCENES -->
<div class="card">

<h2>Manage Scenes (Drag to Reorder)</h2>

<table>

<thead>
<tr>
<th>Scene ID</th>
<th>Image</th>
<th>Links</th>
<th>Edit Directions</th>
</tr>
</thead>

<tbody id="sortable">

{% for sid, scene in scenes.items() %}

<tr draggable="true" data-id="{{ sid }}">

<td><strong>{{ sid }}</strong></td>

<td>
<img src="/static/images/{{ scene.image }}" width="100" style="border-radius:6px;">
</td>

<td>

{% for d in ["forward","back","left","right"] %}
{% if scene[d] %}
{{ d }} → {{ scene[d] }}<br>
{% endif %}
{% endfor %}

</td>

<td>

<form action="/edit-directions" method="POST" class="form-grid edit-form">

<input type="hidden" name="scene_id" value="{{ sid }}">

<select name="forward" class="edit-dropdown" data-current="{{ scene.forward }}"></select>
<select name="back" class="edit-dropdown" data-current="{{ scene.back }}"></select>
<select name="left" class="edit-dropdown" data-current="{{ scene.left }}"></select>
<select name="right" class="edit-dropdown" data-current="{{ scene.right }}"></select>

<label class="override-label">
<input type="checkbox" name="override"> Override reverse links
</label>

<button class="secondary-btn">Update</button>

</form>

<button
class="secondary-btn"
style="background:#dc3545;margin-top:6px"
onclick="deleteScene('{{ sid }}')">
Delete Scene
</button>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>



<!-- SCENE GRAPH EDITOR -->


<a href="/menu">
<button class="primary-btn">Menu Manager</button>
</a>

</div>



<script>

const tbody=document.getElementById("sortable")
let dragged


tbody.addEventListener("dragstart",e=>{
dragged=e.target
e.target.classList.add("dragging")
})

tbody.addEventListener("dragend",e=>{
e.target.classList.remove("dragging")
saveOrder()
})

tbody.addEventListener("dragover",e=>{
e.preventDefault()

const after=getAfterElement(tbody,e.clientY)

after==null ? tbody.appendChild(dragged) : tbody.insertBefore(dragged,after)

})

function getAfterElement(container,y){

return [...container.querySelectorAll("tr:not(.dragging)")].reduce((c,el)=>{

const box=el.getBoundingClientRect()
const offset=y-box.top-box.height/2

return offset<0 && offset>c.offset ? {offset,el} : c

},{offset:-Infinity}).el

}


function saveOrder(){

const order=[...tbody.children].map(tr=>tr.dataset.id)

fetch("/reorder-scenes",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({order})

})

}



function deleteScene(sceneId){

if(!confirm(`Delete scene "${sceneId}"?`)) return

fetch("/delete-scene",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({scene_id:sceneId})

}).then(()=>location.reload())

}



</script>



<script>

document.addEventListener("DOMContentLoaded", () => {

const scenes = {{ scenes | tojson }}

const reverse = {
forward:"back",
back:"forward",
left:"right",
right:"left"
}

const portCode = {
forward:"f",
back:"b",
left:"l",
right:"r"
}

let elements=[]

let startX=200
let startY=300
let gap=280


/* CREATE SCENES + PORTS */

Object.keys(scenes).forEach((sid,i)=>{

let x=startX+(i*gap)
let y=startY

elements.push({
data:{ id:sid, label:sid, type:"scene" },
position:{x:x,y:y}
})

elements.push({
data:{id:`${sid}_f`,scene:sid,dir:"forward",type:"port"},
position:{x:x,y:y-45}
})

elements.push({
data:{id:`${sid}_b`,scene:sid,dir:"back",type:"port"},
position:{x:x,y:y+45}
})

elements.push({
data:{id:`${sid}_l`,scene:sid,dir:"left",type:"port"},
position:{x:x-80,y:y}
})

elements.push({
data:{id:`${sid}_r`,scene:sid,dir:"right",type:"port"},
position:{x:x+80,y:y}
})

})


/* EXISTING LINKS */

Object.keys(scenes).forEach(sid=>{

Object.keys(portCode).forEach(dir=>{

let target=scenes[sid][dir]

if(target){

elements.push({
data:{
source:`${sid}_${portCode[dir]}`,
target:`${target}_${portCode[reverse[dir]]}`
}
})

}

})

})


const cy = cytoscape({

container:document.getElementById("sceneGraph"),

elements:elements,

style:[

{
selector:'node[type="scene"]',
style:{
'shape':'roundrectangle',
'width':160,
'height':90,
'label':'data(label)',
'text-valign':'center',
'text-halign':'center',
'background-color':'#f4f6fb',
'border-width':2,
'border-color':'#333'
}
},

{
selector:'node[type="port"]',
style:{
'shape':'ellipse',
'width':16,
'height':16,
'background-color':'#007bff',
'border-width':2,
'border-color':'white'
}
},

{
selector:'edge',
style:{
'curve-style':'bezier',
'width':3,
'line-color':'#333',
'target-arrow-shape':'triangle',
'target-arrow-color':'#333',
'arrow-scale':1.4
}
}

],

layout:{ name:"preset" }

})


/* LOCK NODES */

cy.nodes().forEach(n=>n.lock())


/* EDGE HANDLE CONFIG */

const eh = cy.edgehandles({

handleNodes:'node[type="port"]',

handlePosition:(node)=>'middle middle',

handleSize:14,

handleColor:'#ff0000',

edgeType:()=> 'flat',

loopAllowed:()=> false,

snap:true,

snapThreshold:70,

preview:true,

hoverDelay:50

})


/* CONNECT PORTS */

cy.on('ehcomplete',(event,source,target,edge)=>{

if(source.data("scene")===target.data("scene")){
edge.remove()
return
}

let fromScene=source.data("scene")
let direction=source.data("dir")
let toScene=target.data("scene")

fetch("/connect-scenes",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({
from_scene:fromScene,
to_scene:toScene,
direction:direction
})

})

})


/* DELETE EDGE */

cy.on("tap","edge",(evt)=>{

if(confirm("Delete this direction?")){
evt.target.remove()
}

})

})

</script>
</body>
</html>
